name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  go-quality:
    name: Go quality
    needs: branch-policy
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate bootstrap installer
        shell: bash
        run: |
          set -euo pipefail
          bash -n install.sh
          ./install.sh --dry-run --non-interactive --version v1.2.3 --install-dir /tmp/homelab-dashboard-ci
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
          check-latest: true
          cache: true
      - name: Verify modules
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Unit and integration tests
        run: go test ./... -count=1 -timeout=180s

  go-race:
    name: Go race
    needs: browser-ui
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
          check-latest: true
          cache: true
      - name: Race detector
        run: go test -race ./... -count=1 -timeout=240s

  branch-policy:
    name: Branch policy
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Require develop or hotfix source branch
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" || "$BASE_REF" != "main" ]]; then
            exit 0
          fi
          case "$HEAD_REF" in
            develop|hotfix/*) ;;
            *)
              echo "Pull requests targeting main must come from develop or hotfix/*. Got: $HEAD_REF" >&2
              exit 1
              ;;
          esac

  browser-ui:
    name: Browser UI
    needs: go-quality
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
          check-latest: true
          cache: true
      - name: Verify Chrome or Chromium is available
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          "$browser" --version
      - name: Browser UI regression tests
        run: go test -tags=browser ./tests/browser -count=1 -v -timeout=180s

  container-compose:
    name: Container build and Compose config
    needs: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build dashboard container
        run: docker build --file Containerfile --target dashboard --tag homelab-dashboard:ci .
      - name: Validate Compose configuration
        env:
          ADMIN_USERS: ci@example.invalid
          TS_AUTHKEY: tskey-auth-ci
          XDG_RUNTIME_DIR: /tmp/homelab-dashboard-runtime
        run: |
          set -euo pipefail
          mkdir -p "$XDG_RUNTIME_DIR"
          docker compose --file compose.yml config --quiet
      - name: Validate optional logging overlay
        env:
          ADMIN_USERS: ci@example.invalid
          TS_AUTHKEY: tskey-auth-ci
          XDG_RUNTIME_DIR: /tmp/homelab-dashboard-runtime
          PODMAN_SOCKET_PATH: /var/run/docker.sock
          VECTOR_LOG: info
        run: |
          set -euo pipefail
          docker compose --file compose.yml --file compose.logging.yml config --quiet
          docker run --rm \
            -v "$PWD/deploy/logging/vector.yml:/etc/vector/vector.yml:ro" \
            docker.io/timberio/vector:0.46.1-alpine \
            validate --skip-healthchecks /etc/vector/vector.yml
      - name: Exercise Loki and Vector logging pipeline
        env:
          ADMIN_USERS: ci@example.invalid
          TS_AUTHKEY: tskey-auth-ci
          XDG_RUNTIME_DIR: /tmp/homelab-dashboard-runtime
          PODMAN_SOCKET_PATH: /var/run/docker.sock
          VECTOR_LOG: info
        run: |
          set -euo pipefail
          project_args=(--file compose.yml --file compose.logging.yml)
          cleanup() {
            status="$?"
            trap - EXIT
            if [ "$status" -ne 0 ]; then
              docker compose "${project_args[@]}" logs --no-color vector loki || true
              vector_id="$(docker compose "${project_args[@]}" ps --quiet vector 2>/dev/null || true)"
              if [ -n "$vector_id" ]; then
                docker exec "$vector_id" /bin/sh -c 'ls -lL /run/podman/podman.sock; test -S /run/podman/podman.sock' || true
              fi
            fi
            docker rm --force homelab-dashboard-logging-fixture homelab-dashboard-unlabeled-fixture 2>/dev/null || true
            docker compose "${project_args[@]}" down --volumes --remove-orphans 2>/dev/null || true
            exit "$status"
          }
          trap cleanup EXIT

          docker compose "${project_args[@]}" up --detach loki

          # docker_logs applies label inclusion while it discovers containers.
          # Starting fixtures first makes this deterministic rather than
          # depending on a Docker event arriving during Vector initialization.
          docker run --detach --name homelab-dashboard-logging-fixture \
            --label io.homelab.dashboard.logs=enabled \
            --label io.homelab.dashboard.log.service=logging-fixture \
            --volume "$PWD/deploy/logging/fixtures/emit-logs.sh:/emit-logs.sh:ro" \
            docker.io/library/busybox:1.36 sh /emit-logs.sh
          docker run --detach --name homelab-dashboard-unlabeled-fixture \
            docker.io/library/busybox:1.36 sh -c 'while :; do echo logging-pipeline-must-not-collect; sleep 1; done'
          docker compose "${project_args[@]}" up --detach vector

          loki_id="$(docker compose "${project_args[@]}" ps --quiet loki)"
          test -n "$loki_id"
          query_start="$(( $(date +%s) - 120 ))000000000"
          for attempt in $(seq 1 30); do
            # Vector begins tailing after its container starts. Re-evaluate the
            # range end on every retry so freshly collected entries are in scope.
            query_end="$(date +%s)000000000"
            fixture_query="http://127.0.0.1:3100/loki/api/v1/query_range?query=%7Bjob%3D%22podman%22%2Cnode%3D%22local%22%2Cservice_name%3D%22logging-fixture%22%7D&start=${query_start}&end=${query_end}&limit=100&direction=forward"
            payload="$(docker exec "$loki_id" /busybox/wget -q -O - "$fixture_query" || true)"
            if printf '%s' "$payload" | grep -Fq 'logging-pipeline-e2e'; then
              break
            fi
            sleep 1
          done
          if ! printf '%s' "$payload" | grep -Fq 'logging-pipeline-e2e'; then
            printf 'Loki fixture query did not return the expected event:\n%s\n' "$payload" >&2
            exit 1
          fi

          # A plain-text line must survive too: only JSON logs have request/
          # trace identifiers, but Vector still emits bounded metadata.
          printf '%s' "$payload" | grep -Fq 'logging-pipeline-plaintext-e2e'
          printf '%s' "$payload" | grep -Fq 'container_name'
          printf '%s' "$payload" | grep -Fq 'fixture-request'
          query_end="$(date +%s)000000000"
          all_podman_query="http://127.0.0.1:3100/loki/api/v1/query_range?query=%7Bjob%3D%22podman%22%2Cnode%3D%22local%22%7D&start=${query_start}&end=${query_end}&limit=200&direction=forward"
          all_podman_logs="$(docker exec "$loki_id" /busybox/wget -q -O - "$all_podman_query")"
          ! printf '%s' "$all_podman_logs" | grep -Fq 'logging-pipeline-must-not-collect'

  govulncheck:
    name: Govulncheck
    needs: go-race
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: "1.26.5"
          check-latest: true
          cache: true
      - name: Check known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
