name: Release

on:
  push:
    tags: ["v*"]

permissions:
  attestations: write
  contents: write
  id-token: write
  packages: write
  security-events: write

jobs:
  release:
    name: Verify source and publish release
    runs-on: ubuntu-latest
    steps:
      - name: Check out the tag and main history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require tagged commit to be reachable from origin/main
        shell: bash
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin main:refs/remotes/origin/main
          tag_commit="$(git rev-parse "${TAG_NAME}^{commit}")"
          git merge-base --is-ancestor "$tag_commit" origin/main
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26.5"
          check-latest: true
          cache: true
      - name: Initialize CodeQL
        uses: github/codeql-action/init@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4
        with:
          languages: go
          build-mode: manual
      - name: Verify modules, vet, and test
        run: |
          set -euo pipefail
          go mod verify
          go vet ./...
          go test ./... -count=1 -timeout=180s
      - name: Race detector
        run: go test -race ./... -count=1 -timeout=240s
      - name: Verify Chrome or Chromium is available
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$browser"
          "$browser" --version
      - name: Browser UI regression tests
        run: go test -tags=browser ./tests/browser -count=1 -timeout=180s
      - name: Build dashboard container
        run: docker build --file Containerfile --target dashboard --tag homelab-dashboard:release .
      - name: Validate Compose configuration
        env:
          ADMIN_USERS: ci@example.invalid
          TS_AUTHKEY: tskey-auth-ci
          XDG_RUNTIME_DIR: /tmp/homelab-dashboard-runtime
        run: |
          set -euo pipefail
          mkdir -p "$XDG_RUNTIME_DIR"
          docker compose --file compose.yml config --quiet
      - name: Check known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Build Go packages for CodeQL
        run: go build ./...
      - name: Analyze CodeQL
        uses: github/codeql-action/analyze@e0647621c2984b5ed2f768cb892365bf2a616ad1 # v4
        with:
          category: /language:go
      - name: Set up QEMU for multi-architecture builds
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Log in to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Derive release image metadata
        id: image-meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          flavor: |
            latest=false
          images: |
            ghcr.io/bnhminh1010/homelab-dashboard
            docker.io/${{ secrets.DOCKERHUB_USERNAME }}/homelab-dashboard
          tags: |
            type=semver,pattern={{raw}}
            type=semver,pattern=v{{major}}.{{minor}},enable=${{ !contains(github.ref_name, '-') && !startsWith(github.ref_name, 'v0.') }}
            type=semver,pattern=v{{major}},enable=${{ !contains(github.ref_name, '-') && !startsWith(github.ref_name, 'v0.') }}
            type=sha,prefix=sha-,format=long
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') && !startsWith(github.ref_name, 'v0.') }}
          labels: |
            org.opencontainers.image.title=Homelab Dashboard
            org.opencontainers.image.description=Lightweight self-hosted operations dashboard for rootless Podman homelabs.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
          annotations: |
            org.opencontainers.image.title=Homelab Dashboard
            org.opencontainers.image.description=Lightweight self-hosted operations dashboard for rootless Podman homelabs.
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.licenses=Apache-2.0
      - name: Publish multi-architecture dashboard image
        id: image-build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: Containerfile
          target: dashboard
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.image-meta.outputs.tags }}
          labels: ${{ steps.image-meta.outputs.labels }}
          annotations: ${{ steps.image-meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
      - name: Attest the GitHub Container Registry image
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-name: ghcr.io/bnhminh1010/homelab-dashboard
          subject-digest: ${{ steps.image-build.outputs.digest }}
          push-to-registry: true
      - name: Build release bundle and checksum
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bundle_name="homelab-dashboard-${TAG_NAME}"
          mkdir -p dist
          git archive --format=tar.gz --prefix="${bundle_name}/" "$TAG_NAME" -o "dist/${bundle_name}.tar.gz"
          (cd dist && sha256sum "${bundle_name}.tar.gz" > "${bundle_name}.tar.gz.sha256")
          test -s "dist/${bundle_name}.tar.gz"
          test -s "dist/${bundle_name}.tar.gz.sha256"
      - name: Publish generated release notes
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: gh release create "$TAG_NAME" --verify-tag --generate-notes --title "$TAG_NAME"
      - name: Attach release bundle and checksum
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          bundle_name="homelab-dashboard-${TAG_NAME}"
          gh release upload "$TAG_NAME" \
            "dist/${bundle_name}.tar.gz" \
            "dist/${bundle_name}.tar.gz.sha256" \
            install.sh \
            --clobber
