# Optional centralized logs for the local rootless Podman host only.
# Enable explicitly with:
#   podman compose -f compose.yml -f compose.logging.yml up -d
#
# No service below publishes a host port. Loki is reachable only from the
# private Compose network, including the dashboard through its Tailscale
# network namespace.
services:
  tailscale:
    networks:
      # Retain the default egress network so userspace Tailscale can reach the
      # control plane; `logging` is only the private Loki path.
      - default
      - logging

  dashboard:
    environment:
      # The dashboard receives this only when the logging overlay is enabled.
      # It is an internal URL, never a user-configurable browser endpoint.
      LOGS_BACKEND: loki
      LOKI_URL: http://loki:3100

  loki:
    image: docker.io/grafana/loki:3.4.2
    command: ["-config.file=/etc/loki/loki.yml"]
    volumes:
      - ./deploy/logging/loki.yml:/etc/loki/loki.yml:ro
      - loki-data:/loki
    networks:
      - logging
    healthcheck:
      test: ["CMD", "/busybox/wget", "-q", "-O", "-", "http://127.0.0.1:3100/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
      # Allows the read-only host configuration bind mount under rootless
      # Podman on SELinux hosts; Loki still has no host-published port.
      - label=disable
    restart: unless-stopped
    labels:
      io.homelab.dashboard.protected: "true"
      io.homelab.dashboard.hidden: "true"

  vector:
    image: docker.io/timberio/vector:0.46.1-alpine
    command: ["--config", "/etc/vector/vector.yml"]
    depends_on:
      loki:
        condition: service_healthy
    environment:
      VECTOR_LOG: warn
    volumes:
      # This defaults to the existing rootless Podman API socket. CI overrides
      # PODMAN_SOCKET_PATH with Docker's real socket rather than bind-mounting
      # a symlink, which is not portable across container runtimes.
      - ${PODMAN_SOCKET_PATH:-${XDG_RUNTIME_DIR:?XDG_RUNTIME_DIR is required}/podman/podman.sock}:/run/podman/podman.sock:ro
      - ./deploy/logging/vector.yml:/etc/vector/vector.yml:ro
      - vector-data:/var/lib/vector
    networks:
      - logging
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,noexec,size=16m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges
      # Required for a rootless Podman Unix-socket mount on SELinux hosts.
      - label=disable
    pids_limit: 128
    restart: unless-stopped
    labels:
      io.homelab.dashboard.protected: "true"
      io.homelab.dashboard.hidden: "true"

volumes:
  loki-data:
  vector-data:

networks:
  logging:
    internal: true
