# Single-process Loki for a personal homelab. This configuration deliberately
# has no authentication because compose.logging.yml keeps it on an internal
# network with no published port.
auth_enabled: false

server:
  http_listen_address: 0.0.0.0
  http_listen_port: 3100

common:
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

schema_config:
  configs:
    - from: "2024-01-01"
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  filesystem:
    directory: /loki/chunks
  tsdb_shipper:
    active_index_directory: /loki/index
    cache_location: /loki/index-cache

compactor:
  working_directory: /loki/compactor
  retention_enabled: true
  delete_request_store: filesystem

limits_config:
  # Historical logs are intentionally bounded. The dashboard's live Podman
  # viewer remains available even when this optional stack is disabled.
  retention_period: 168h
  allow_structured_metadata: true
